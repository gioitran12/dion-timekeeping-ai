<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dion Workplace - AI Webcam Chấm công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(180deg, #071534 0%, #0c1c44 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-nav {
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.25rem;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 38px;
            height: 38px;
            background: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .camera-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 720px;
            margin: 0 auto;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 440px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            border: 2px solid #1e293b;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        .scan-bar {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #60a5fa, transparent);
            box-shadow: 0 0 15px #38bdf8;
            animation: scanMove 2.2s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 2%; opacity: 0.3; }
            50% { top: 96%; opacity: 1; }
            100% { top: 2%; opacity: 0.3; }
        }

        .mode-btn {
            border-radius: 12px;
            font-weight: 700;
            padding: 10px 24px;
        }
    </style>
</head>
<body class="py-2">

    <!-- Top Navigation -->
    <header class="header-nav mb-4">
        <a href="/" class="brand-logo">
            <div class="brand-icon-box">
                <i class="bi bi-person-bounding-box"></i>
            </div>
            <div>
                <div>DION WORKPLACE</div>
                <div style="font-size: 0.65rem; color: #60a5fa; letter-spacing: 1.5px;">DIGITAL INNOVATION</div>
            </div>
        </a>
        <a href="/" class="btn btn-outline-light rounded-pill px-3 btn-sm">
            <i class="bi bi-house-door me-1"></i> Quay lại Dashboard
        </a>
    </header>

    <div class="container text-center my-auto pb-4">
        <!-- Main Camera Container -->
        <div class="camera-card">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="text-start">
                    <h4 class="fw-bold mb-0 text-white">AI Camera Scanner</h4>
                    <p class="text-secondary small mb-0">Quét video webcam tự động điểm danh real-time</p>
                </div>
                <!-- Chọn chế độ Checkin/Checkout -->
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="checkType" id="checkinRadio" value="CHECKIN" checked>
                    <label class="btn btn-outline-success mode-btn" for="checkinRadio"><i class="bi bi-box-arrow-in-right me-1"></i> Check-in</label>

                    <input type="radio" class="btn-check" name="checkType" id="checkoutRadio" value="CHECKOUT">
                    <label class="btn btn-outline-warning mode-btn" for="checkoutRadio"><i class="bi bi-box-arrow-right me-1"></i> Check-out</label>
                </div>
            </div>

            <!-- Khung Webcam Stream -->
            <div class="camera-wrapper mb-3">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div class="scan-bar"></div>
            </div>

            <!-- Status Indicator -->
            <div class="mb-3">
                <span id="statusBadge" class="badge bg-primary px-4 py-2 fs-6 rounded-pill">
                    <i class="bi bi-cpu me-1"></i> Đang tải AI Model nhận diện...
                </span>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="alert alert-success d-none text-start p-3 rounded-4 border-0 shadow" style="background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981 !important;">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <div class="fs-5 fw-bold text-success mb-1" id="resEmployeeName">Trần Giỏi</div>
                        <div class="small text-light">Mã NV: <span id="resEmployeeCode" class="fw-bold"></span> | Thời gian: <span id="resTime"></span></div>
                    </div>
                    <div class="text-end">
                        <span class="badge bg-success fs-6" id="resConfidence">98%</span>
                        <div class="small text-secondary mt-1" id="resStatus">Đúng giờ</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const statusBadge = document.getElementById('statusBadge');
        const resultBox = document.getElementById('resultBox');

        let isModelLoaded = false;
        let isProcessingFrame = false;
        let isCooldown = false;
        let currentLatitude = null;
        let currentLongitude = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLatitude = pos.coords.latitude;
                    currentLongitude = pos.coords.longitude;
                },
                (err) => console.warn('GPS Info:', err.message)
            );
        }

        async function initAI() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                isModelLoaded = true;
                statusBadge.innerHTML = '<i class="bi bi-camera-video me-1"></i> Sẵn sàng! Hãy nhìn vào webcam.';
                statusBadge.className = 'badge bg-info px-4 py-2 fs-6 rounded-pill text-dark';
                startWebcam();
            } catch (err) {
                statusBadge.innerText = 'Lỗi nạp mô hình: ' + err.message;
                statusBadge.className = 'badge bg-danger px-4 py-2 fs-6 rounded-pill';
            }
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => { video.srcObject = stream; })
                .catch(err => {
                    statusBadge.innerText = 'Không thể mở Webcam: ' + err.message;
                    statusBadge.className = 'badge bg-danger px-4 py-2 fs-6 rounded-pill';
                });
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!isModelLoaded || isProcessingFrame || isCooldown) return;
                isProcessingFrame = true;

                try {
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks()
                        .withFaceDescriptor();

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detection) {
                        const resizedDetections = faceapi.resizeResults(detection, displaySize);
                        faceapi.draw.drawDetections(canvas, resizedDetections);

                        const descriptorArray = Array.from(detection.descriptor);
                        const selectedCheckType = document.querySelector('input[name="checkType"]:checked').value;

                        statusBadge.innerHTML = '<i class="bi bi-search me-1"></i> Đang nhận diện...';
                        statusBadge.className = 'badge bg-warning text-dark px-4 py-2 fs-6 rounded-pill';

                        const res = await fetch('/api/timekeeping/stream-recognize', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                faceDescriptor: descriptorArray,
                                checkType: selectedCheckType,
                                latitude: currentLatitude,
                                longitude: currentLongitude
                            })
                        });

                        const data = await res.json();
                        if (data.success) {
                            showResult(data);
                            isCooldown = true;
                            setTimeout(() => {
                                isCooldown = false;
                                statusBadge.innerHTML = '<i class="bi bi-camera-video me-1"></i> Sẵn sàng cho lượt tiếp theo';
                                statusBadge.className = 'badge bg-info text-dark px-4 py-2 fs-6 rounded-pill';
                            }, 4000);
                        } else {
                            statusBadge.innerText = data.message || 'Khuôn mặt chưa khớp nhân viên';
                            statusBadge.className = 'badge bg-secondary px-4 py-2 fs-6 rounded-pill';
                        }
                    } else {
                        statusBadge.innerText = 'Vui lòng nhìn thẳng vào camera';
                        statusBadge.className = 'badge bg-secondary px-4 py-2 fs-6 rounded-pill';
                    }
                } catch (e) {
                    console.error('Scan Error:', e);
                } finally {
                    isProcessingFrame = false;
                }
            }, 400);
        });

        function showResult(data) {
            statusBadge.innerHTML = '🎉 ' + data.message + ' - Đang chuyển sang trang Chấm công...';
            statusBadge.className = 'badge bg-success px-4 py-2 fs-6 rounded-pill';

            resultBox.classList.remove('d-none');
            document.getElementById('resEmployeeName').innerText = data.employeeName;
            document.getElementById('resEmployeeCode').innerText = data.employeeCode;
            document.getElementById('resTime').innerText = data.time;
            document.getElementById('resStatus').innerText = data.status || 'Hợp lệ';
            document.getElementById('resConfidence').innerText = (data.confidenceScore * 100).toFixed(0) + '%';

            // Sau khi nhận diện thành công 2.5s thì chuyển về trang Chấm công / Lịch sử
            setTimeout(() => {
                window.location.href = '/timekeeping/history';
            }, 2500);
        }

        window.onload = initAI;
    </script>
</body>
</html>
