<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dion Workplace - AI Chấm công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dion-theme.css}">
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

    <style>
        .scanner-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            max-width: 760px;
            margin: 0 auto;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            height: 440px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            border: 2px solid #1e293b;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        .scan-bar {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #60a5fa, transparent);
            box-shadow: 0 0 15px #38bdf8;
            animation: scanMove 2.2s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 2%; opacity: 0.3; }
            50% { top: 96%; opacity: 1; }
            100% { top: 2%; opacity: 0.3; }
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.done { background: #10b981; }
        .status-dot.pending { background: #f59e0b; }
        .status-dot.none { background: #cbd5e1; }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR CHUẨN DION WORKPLACE -->
    <aside th:replace="~{fragments/navbar :: sidebar('scan')}"></aside>

    <!-- 2. MAIN CONTENT WRAPPER -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header th:replace="~{fragments/navbar :: topbar('AI Chấm công')}"></header>

        <!-- Main Body -->
        <main class="content-container">

            <!-- Loading overlay khi đang kiểm tra trạng thái -->
            <div id="loadingState" class="text-center py-5">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p class="text-secondary fw-semibold">Đang kiểm tra trạng thái chấm công hôm nay...</p>
            </div>

            <!-- Done state: đã check-in & check-out hôm nay -->
            <div id="doneState" class="d-none">
                <div class="scanner-card text-center py-5">
                    <div style="font-size: 4rem;">🎉</div>
                    <h3 class="fw-bold text-success mt-3">Đã hoàn thành chấm công hôm nay!</h3>
                    <p class="text-secondary">Bạn đã ghi nhận đủ giờ vào (Check-in) và giờ ra (Check-out).</p>
                    <div class="d-flex gap-3 justify-content-center mt-3" id="doneTimeInfo"></div>
                    <a href="/timekeeping/history" class="btn btn-primary mt-4 rounded-pill px-4 fw-bold">
                        <i class="bi bi-calendar-check me-1"></i> Xem lịch sử chấm công
                    </a>
                </div>
            </div>

            <!-- Main Camera Scanner Container -->
            <div id="mainState" class="d-none">
                <div class="scanner-card">
                    <!-- Header -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div>
                            <h4 class="fw-bold mb-0 text-dark">AI Camera Scanner</h4>
                            <p class="text-muted small mb-0" id="modeDescription">Đang tải...</p>
                        </div>
                        <div>
                            <span id="modeIndicator" class="badge fs-6 px-3 py-2 rounded-pill"></span>
                        </div>
                    </div>

                    <!-- Trạng thái hôm nay -->
                    <div class="bg-light p-3 rounded-4 mb-3 d-flex gap-4 text-start border">
                        <div>
                            <span class="status-dot" id="dotCheckin"></span>
                            <span class="small ms-2 text-dark">Check-in: <strong id="txtCheckin">--:--</strong></span>
                        </div>
                        <div>
                            <span class="status-dot" id="dotCheckout"></span>
                            <span class="small ms-2 text-dark">Check-out: <strong id="txtCheckout">--:--</strong></span>
                        </div>
                        <div class="ms-auto text-end">
                            <span class="small text-muted" id="currentDateTxt"></span>
                        </div>
                    </div>

                    <!-- Khung Webcam Stream -->
                    <div class="camera-wrapper mb-3">
                        <video id="webcam" autoplay playsinline muted></video>
                        <canvas id="overlay"></canvas>
                        <div class="scan-bar"></div>
                    </div>

                    <!-- Status Indicator -->
                    <div class="text-center mb-3">
                        <span id="statusBadge" class="badge bg-primary px-4 py-2 fs-6 rounded-pill">
                            <i class="bi bi-cpu me-1"></i> Đang tải AI Model nhận diện...
                        </span>
                    </div>

                    <!-- Result Box -->
                    <div id="resultBox" class="alert d-none text-start p-3 rounded-4 border-0 shadow-sm"
                         style="background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981 !important;">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="fs-5 fw-bold text-success mb-1" id="resEmployeeName"></div>
                                <div class="small text-dark">Mã NV: <span id="resEmployeeCode" class="fw-bold"></span> | Thời gian: <span id="resTime"></span></div>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-success fs-6" id="resConfidence">--%</span>
                                <div class="small text-secondary mt-1" id="resStatus"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const statusBadge = document.getElementById('statusBadge');
        const resultBox = document.getElementById('resultBox');

        let isModelLoaded = false;
        let isProcessingFrame = false;
        let isCooldown = false;
        let currentLatitude = null;
        let currentLongitude = null;
        let currentCheckType = 'CHECKIN';
        let scanningActive = true;
        let recognizedUser = null; // Lưu thông tin người nhận diện gần nhất để vẽ lên khung

        // Lấy GPS
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLatitude = pos.coords.latitude;
                    currentLongitude = pos.coords.longitude;
                },
                (err) => console.warn('GPS:', err.message)
            );
        }

        // Hiển thị ngày hiện tại
        const now = new Date();
        document.getElementById('currentDateTxt').textContent =
            now.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' });

        // =====================
        // 1. Kiểm tra trạng thái hôm nay
        // =====================
        async function checkTodayStatus() {
            try {
                const res = await fetch('/api/timekeeping/today-status');
                const data = await res.json();

                document.getElementById('loadingState').classList.add('d-none');

                if (data.hasCheckedIn && data.hasCheckedOut) {
                    showDoneState(data);
                    return;
                }

                if (!data.hasCheckedIn) {
                    currentCheckType = 'CHECKIN';
                    setModeUI('CHECKIN');
                    updateCheckinStatus(null, null);
                } else {
                    currentCheckType = 'CHECKOUT';
                    setModeUI('CHECKOUT');
                    updateCheckinStatus(data.checkInTime, null);
                }

                document.getElementById('mainState').classList.remove('d-none');
                initAI();

            } catch (err) {
                document.getElementById('loadingState').innerHTML =
                    '<p class="text-danger">Lỗi kết nối: ' + err.message + '</p>';
            }
        }

        function showDoneState(data) {
            document.getElementById('doneState').classList.remove('d-none');
            const container = document.getElementById('doneTimeInfo');
            container.innerHTML = `
                <div class="bg-light border rounded-3 p-3 px-4">
                    <div class="small text-secondary">Check-in</div>
                    <div class="fw-bold text-success fs-5">${data.checkInTime || '--'}</div>
                </div>
                <div class="bg-light border rounded-3 p-3 px-4">
                    <div class="small text-secondary">Check-out</div>
                    <div class="fw-bold text-warning fs-5">${data.checkOutTime || '--'}</div>
                </div>
            `;
        }

        function setModeUI(mode) {
            const indicator = document.getElementById('modeIndicator');
            const desc = document.getElementById('modeDescription');
            if (mode === 'CHECKIN') {
                indicator.textContent = '🟢 Chế độ: CHECK-IN';
                indicator.className = 'badge bg-success fs-6 px-3 py-2 rounded-pill';
                desc.textContent = 'Nhìn thẳng vào camera để ghi nhận giờ vào làm';
            } else {
                indicator.textContent = '🟡 Chế độ: CHECK-OUT';
                indicator.className = 'badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill';
                desc.textContent = 'Nhìn thẳng vào camera để ghi nhận giờ ra về';
            }
        }

        function updateCheckinStatus(checkInTime, checkOutTime) {
            const dotIn = document.getElementById('dotCheckin');
            const dotOut = document.getElementById('dotCheckout');
            const txtIn = document.getElementById('txtCheckin');
            const txtOut = document.getElementById('txtCheckout');

            if (checkInTime) {
                dotIn.className = 'status-dot done';
                txtIn.textContent = checkInTime;
            } else {
                dotIn.className = 'status-dot none';
                txtIn.textContent = 'Chưa';
            }

            if (checkOutTime) {
                dotOut.className = 'status-dot done';
                txtOut.textContent = checkOutTime;
            } else {
                dotOut.className = 'status-dot pending';
                txtOut.textContent = 'Chưa';
            }
        }

        // =====================
        // 2. Khởi tạo AI Model
        // =====================
        async function initAI() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                isModelLoaded = true;
                statusBadge.innerHTML = '<i class="bi bi-camera-video me-1"></i> Sẵn sàng! Hãy nhìn vào webcam.';
                statusBadge.className = 'badge bg-info text-dark px-4 py-2 fs-6 rounded-pill';
                startWebcam();
            } catch (err) {
                statusBadge.innerText = 'Lỗi nạp mô hình: ' + err.message;
                statusBadge.className = 'badge bg-danger px-4 py-2 fs-6 rounded-pill';
            }
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => { video.srcObject = stream; })
                .catch(err => {
                    statusBadge.innerText = 'Không thể mở Webcam: ' + err.message;
                    statusBadge.className = 'badge bg-danger px-4 py-2 fs-6 rounded-pill';
                });
        }

        // =====================
        // 3. Hàm vẽ Bounding Box + Tên Người trên Webcam
        // =====================
        function drawFaceWithLabel(ctx, box, info) {
            const { x, y, width, height } = box;
            const isMatch = info && info.success;
            const color = isMatch ? '#10b981' : (info && info.message ? '#f59e0b' : '#38bdf8');
            const bgColor = isMatch ? 'rgba(16, 185, 129, 0.95)' : 'rgba(15, 23, 42, 0.85)';

            // 1. Viền hộp khuôn mặt bo góc
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, 12);
            ctx.stroke();

            // 2. 4 góc định vị công nghệ cao (HUD corners)
            const cLen = Math.min(24, width / 4);
            ctx.lineWidth = 4;
            // Top-left
            ctx.beginPath(); ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y); ctx.stroke();
            // Top-right
            ctx.beginPath(); ctx.moveTo(x + width - cLen, y); ctx.lineTo(x + width, y); ctx.lineTo(x + width, y + cLen); ctx.stroke();
            // Bottom-left
            ctx.beginPath(); ctx.moveTo(x, y + height - cLen); ctx.lineTo(x, y + height); ctx.lineTo(x + cLen, y + height); ctx.stroke();
            // Bottom-right
            ctx.beginPath(); ctx.moveTo(x + width - cLen, y + height); ctx.lineTo(x + width, y + height); ctx.lineTo(x + width, y + height - cLen); ctx.stroke();

            // 3. Nhãn tên người đè lên trên đỉnh hộp khuôn mặt
            let labelText = '🔍 Đang nhận diện...';
            if (isMatch) {
                labelText = `👤 ${info.employeeName} (${info.employeeCode}) · ${(info.confidenceScore * 100).toFixed(0)}%`;
            } else if (info && info.message) {
                labelText = `⚠️ ${info.message}`;
            }

            ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
            const textWidth = ctx.measureText(labelText).width;
            const badgeW = textWidth + 24;
            const badgeH = 28;
            const badgeX = x + (width - badgeW) / 2;
            const badgeY = Math.max(8, y - badgeH - 10);

            // Nền badge
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 7);
            ctx.fill();

            // Text nhãn: Đảo ngược gương cục bộ để đọc xuôi chiều tự nhiên
            ctx.save();
            const centerX = badgeX + badgeW / 2;
            const centerY = badgeY + badgeH / 2;
            ctx.translate(centerX, centerY);
            ctx.scale(-1, 1);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(labelText, 0, 0);
            ctx.restore();
        }

        // =====================
        // 4. Vòng lặp nhận diện
        // =====================
        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth || 640, height: video.videoHeight || 480 };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (!isModelLoaded || isProcessingFrame || isCooldown || !scanningActive) return;
                isProcessingFrame = true;

                try {
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                        .withFaceLandmarks()
                        .withFaceDescriptor();

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    if (detection) {
                        const resizedDetections = faceapi.resizeResults(detection, displaySize);
                        const box = resizedDetections.detection.box;

                        // Vẽ khung trước với trạng thái hiện tại
                        drawFaceWithLabel(ctx, box, recognizedUser);

                        const descriptorArray = Array.from(detection.descriptor);

                        statusBadge.innerHTML = '<i class="bi bi-search me-1"></i> Đang nhận diện...';
                        statusBadge.className = 'badge bg-warning text-dark px-4 py-2 fs-6 rounded-pill';

                        const res = await fetch('/api/timekeeping/stream-recognize', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                faceDescriptor: descriptorArray,
                                checkType: currentCheckType,
                                latitude: currentLatitude,
                                longitude: currentLongitude
                            })
                        });

                        const data = await res.json();
                        recognizedUser = data;

                        // Vẽ lại với thông tin tên người vừa nhận diện được
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        drawFaceWithLabel(ctx, box, data);

                        if (data.success) {
                            showResult(data);
                            isCooldown = true;
                            scanningActive = false;
                        } else {
                            statusBadge.innerText = data.message || 'Khuôn mặt chưa khớp';
                            statusBadge.className = 'badge bg-secondary px-4 py-2 fs-6 rounded-pill';
                        }
                    } else {
                        recognizedUser = null;
                        statusBadge.innerText = 'Vui lòng nhìn thẳng vào camera';
                        statusBadge.className = 'badge bg-secondary px-4 py-2 fs-6 rounded-pill';
                    }
                } catch (e) {
                    console.error('Scan Error:', e);
                } finally {
                    isProcessingFrame = false;
                }
            }, 400);
        });

        // =====================
        // 5. Hiển thị kết quả thành công
        // =====================
        function showResult(data) {
            statusBadge.innerHTML = '🎉 ' + data.message + ' — Đang chuyển trang...';
            statusBadge.className = 'badge bg-success px-4 py-2 fs-6 rounded-pill';

            resultBox.classList.remove('d-none');
            document.getElementById('resEmployeeName').innerText = data.employeeName;
            document.getElementById('resEmployeeCode').innerText = data.employeeCode;
            document.getElementById('resTime').innerText = data.time;
            document.getElementById('resStatus').innerText = data.status || 'Hợp lệ';
            document.getElementById('resConfidence').innerText = (data.confidenceScore * 100).toFixed(0) + '%';

            setTimeout(() => {
                window.location.href = '/timekeeping/history';
            }, 2500);
        }

        window.onload = checkTodayStatus;
    </script>
</body>
</html>
