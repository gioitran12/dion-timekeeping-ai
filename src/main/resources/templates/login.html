<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dion Workplace - Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #071534 0%, #0c1c44 50%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-icon-box {
            width: 44px;
            height: 44px;
            background: #2563eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <div class="brand-icon-box">
                <i class="bi bi-person-bounding-box"></i>
            </div>
            <div>
                <div class="fw-bold fs-4 text-white leading-none">DION</div>
                <div style="font-size: 0.7rem; color: #60a5fa; letter-spacing: 1.5px; font-weight: 600;">DIGITAL INNOVATION</div>
            </div>
        </div>

        <h4 class="text-center fw-bold mb-1">Đăng nhập Workplace</h4>
        <p class="text-center text-secondary small mb-4">Hệ thống quản lý nhân sự & Chấm công AI Camera</p>

        <div th:if="${param.error}" class="alert alert-danger py-2 small rounded-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Sai tên đăng nhập hoặc mật khẩu!
        </div>

        <div th:if="${param.logout}" class="alert alert-info py-2 small rounded-3" role="alert">
            <i class="bi bi-info-circle-fill me-1"></i> Bạn đã đăng xuất thành công.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-light">Tên đăng nhập (Username)</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-light">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-login mb-3">
                Đăng nhập
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/timekeeping/scan" class="text-info text-decoration-none small">
                <i class="bi bi-camera-fill me-1"></i> Chuyển sang máy quét chấm công (Kiosk AI)
            </a>
        </div>
    </div>

</body>
</html>
